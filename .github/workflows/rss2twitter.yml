name: RSS to Twitter

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时执行一次，可按需调整
  workflow_dispatch: {}

concurrency:
  group: rss2twitter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RSS → Twitter publisher
        run: python rss2twitter.py
        env:
          RSS_FEED_URLS: ${{ secrets.RSS_FEED_URLS }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET_KEY: ${{ secrets.TWITTER_API_SECRET_KEY }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}

      - name: Commit published IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published_ids.json
          if git diff --cached --quiet; then
            echo "No published ID changes to commit."
            exit 0
          fi

          git commit -m "Update published RSS item state"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying after remote sync."
            sleep 5
          done

          echo "Failed to push published ID update after 3 attempts."
          exit 1
